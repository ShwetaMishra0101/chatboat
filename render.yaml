services:
  - type: web
    name: chatboat-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: bun install
    startCommand: bun index.ts
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
